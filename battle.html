<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Tetris - Battle</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Дополнительные стили для режима баттла */
    body {
      flex-direction: column;
      gap: 20px;
    }
    .battle-container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
    }
    .player-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 260px;
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(124, 196, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(124, 196, 255, 0.2);
    }
    .player-name {
      font-size: 18px;
      font-weight: bold;
      color: #7cc4ff;
    }
    .lives {
      display: flex;
      gap: 5px;
    }
    .heart {
      color: #ef476f;
      font-size: 20px;
      transition: opacity 0.3s;
    }
    .heart.lost {
      opacity: 0.2;
    }
    .battle-canvas {
      background: #0d1117;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      width: 260px;
      height: 520px; /* Чуть уменьшили размер под два поля */
    }
    .battle-stats {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #9aa7b8;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .battle-stats b {
      color: #e6edf7;
    }
    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #ef476f;
      margin-top: 200px;
      text-shadow: 0 0 10px rgba(239, 71, 111, 0.5);
    }
  </style>
</head>
<body>
  <div class="battle-container">
    <!-- Игрок 1 -->
    <div class="player-panel">
      <div class="player-header">
        <span class="player-name">BOT ALPHA</span>
        <div class="lives" id="lives1"></div>
      </div>
      <canvas id="board1" class="battle-canvas" width="260" height="520"></canvas>
      <div class="battle-stats">
        <span>Score: <b id="score1">0</b></span>
        <span>Lines: <b id="lines1">0</b></span>
      </div>
    </div>

    <div class="vs-divider">VS</div>

    <!-- Игрок 2 -->
    <div class="player-panel">
      <div class="player-header">
        <span class="player-name">BOT BETA</span>
        <div class="lives" id="lives2"></div>
      </div>
      <canvas id="board2" class="battle-canvas" width="260" height="520"></canvas>
      <div class="battle-stats">
        <span>Score: <b id="score2">0</b></span>
        <span>Lines: <b id="lines2">0</b></span>
      </div>
    </div>
  </div>

  <div class="buttons" style="flex-direction: row; width: 100%; justify-content: center;">
    <button id="pauseBtn" style="width: 150px;">Pause</button>
    <button id="restartBtn" style="width: 150px;">Restart Battle</button>
  </div>

  <!-- Оверлей для конца матча -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2 id="overlayTitle">Match Over</h2>
      <p id="overlayDesc"></p>
      <button id="overlayRestart">Play Again</button>
    </div>
  </div>

  <!-- Подключаем звуки (если они у вас есть) -->
  <script src="battle.js"></script>
</body>
</html>
