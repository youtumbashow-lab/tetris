<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <aside class="panel">
      <h1>Super Tetris</h1>
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Lines</span><b id="lines">0</b></div>
      <div class="stat"><span>Level</span><b id="level">1</b></div>
      <div class="next-box">
        <span>Next</span>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div class="buttons">
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
      </div>
    </aside>
  </div>
  <div id="overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2>Game Over</h2>
      <p>Final Score: <b id="finalScore">0</b></p>
      <button id="overlayRestart">Play Again</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
