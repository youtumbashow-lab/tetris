<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тетрис-бот</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <aside class="panel">
      <h1>Тетрис-бот</h1>
      <div class="stat"><span>Счёт</span><b id="score">0</b></div>
      <div class="stat"><span>Линии</span><b id="lines">0</b></div>
      <div class="stat"><span>Уровень</span><b id="level">1</b></div>
      <div class="next-box">
        <span>Следующая</span>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div class="buttons">
        <button id="pauseBtn">Пауза</button>
        <button id="restartBtn">Перезапустить</button>
      </div>
    </aside>
  </div>
  <div id="overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2>Игра окончена</h2>
      <p>Итоговый счёт: <b id="finalScore">0</b></p>
      <button id="overlayRestart">Играть снова</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
